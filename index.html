<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大實驗組試劑效期標籤小工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232c3e50'/><path d='M35 15h30v10H35z' fill='%23bdc3c7'/><path d='M42 25v15L23 80a6 6 0 0 0 5 9h44a6 6 0 0 0 5-9L58 40V25z' fill='%23ecf0f1'/><path d='M27 75l10-25h26l10 25a4 4 0 0 1-3 6H30a4 4 0 0 1-3-6z' fill='%233498db'/><circle cx='75' cy='75' r='20' fill='%23e74c3c'/><path d='M75 65v11l6 4' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <style>
        /* --- 網頁畫面排版 --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            padding-top: 40px;
            padding-bottom: 40px; 
            margin: 0;
            background-image: url('bg.jpg.png');
            background-size: cover;          
            background-position: center;     
            background-attachment: fixed;    
            background-repeat: no-repeat;    
        }
        
        .main-wrapper {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 20px; 
            width: 98%;
            max-width: 1150px; 
            flex-wrap: wrap; 
        }

        /* --- 左側：出庫操作區 --- */
        .container {
            background-color: rgba(255, 255, 255, 0.96); 
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            width: 100%;
            max-width: 380px; 
            flex: 1 1 350px;
            position: sticky; 
            top: 20px; 
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            font-size: 22px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 14px; }
        input[type="text"], input[type="date"], select, input[type="password"] {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px;
            box-sizing: border-box; font-size: 15px; background-color: rgba(255, 255, 255, 0.9); 
        }
        input[type="text"]:focus, input[type="date"]:focus, select:focus, input[type="password"]:focus {
            border-color: #3498db; outline: none;
        }

        #specialActionGroup {
            display: none; background-color: #e8f4f8; padding: 12px; border-radius: 5px; 
            border-left: 4px solid #3498db; margin-bottom: 15px;
        }
        .special-action-title { color: #2980b9; margin-bottom: 8px; font-size: 13px; font-weight: bold; }
        .checkbox-wrapper { display: flex; align-items: center; cursor: pointer; color: #333; font-weight: normal; font-size: 14px; }
        input[type="checkbox"] { width: auto; height: 16px; width: 16px; margin-right: 8px; cursor: pointer; }

        #pastThawGroup {
            display: none; background-color: #fcf3cf; padding: 10px; border-radius: 5px;
            border-left: 4px solid #f39c12; margin-bottom: 15px;
        }
        #pastThawGroup label { color: #d35400; font-size: 13px; }

        #manualExpireGroup {
            display: none; background-color: #fff3cd; padding: 10px; border-radius: 5px;
            border-left: 5px solid #ffc107;
        }

        #lotNumberGroup {
            background-color: #fdfefe; padding: 10px; border-radius: 5px;
            border: 1px solid #aed6f1; border-left: 4px solid #3498db;
        }
        
        .format-group {
            background-color: #f4f6f7; padding: 10px 15px; border-radius: 5px;
            border: 1px solid #dcdde1; margin-bottom: 15px;
        }
        .format-title { color: #2c3e50; font-weight: bold; font-size: 14px; margin-bottom: 8px; }
        .radio-group { display: flex; flex-direction: column; gap: 8px; }
        .radio-label { display: flex; align-items: center; cursor: pointer; font-size: 14px; font-weight: normal; color: #333; }
        .radio-label input[type="radio"] { margin-right: 8px; cursor: pointer; }

        /* 🌟 統一化預覽卡片內的字型大小、間距與顏色 */
        #previewContainer {
            display: flex; flex-direction: row; gap: 0; display: none; margin-top: 15px;
        }
        .result-card {
            padding: 12px; background-color: #e8f6f3; border-radius: 5px; 
            position: relative; width: 100%; box-sizing: border-box;
            border-left: 5px solid #1abc9c; 
            display: flex; flex-direction: column; justify-content: flex-start;
        }
        #previewContainer.double-mode .result-card {
            width: 50%; border-left: none; border: 1px solid #1abc9c; border-radius: 0;
        }
        
        /* 螢幕預覽字體統一設定（全部改為黑色） */
        .result-card p { 
            margin: 3px 0; 
            font-size: 14px; 
            font-weight: bold; 
            color: black; 
            line-height: 1.2; 
        }
        .print-special-tag {
            position: absolute; top: 10px; right: 12px; font-weight: bold;
            color: black; font-size: 14px; display: none;
        }
        .highlight { color: black; }
        .out-lot-num { color: black; }
        
        .print-btn {
            display: block; width: 100%; padding: 10px; background-color: #2980b9;
            color: white; border: none; border-radius: 5px; font-size: 16px;
            font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s;
        }
        .print-btn:hover { background-color: #3498db; }

        /* --- 右側：戰情面板 --- */
        #historySection {
            background-color: rgba(255, 255, 255, 0.96); padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 100%; flex: 1.5 1 450px; 
            max-width: 650px; display: block; 
        }
        .history-header-wrapper { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #bdc3c7; padding-bottom: 8px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .header-title-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        #historySection h3 { color: #2c3e50; margin: 0; font-size: 18px; }
        .admin-toggle-btn { background: transparent; border: 1px solid #bdc3c7; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; color: #7f8c8d; transition: 0.2s; font-weight: bold; }
        .admin-toggle-btn:hover { background: #ecf0f1; color: #2c3e50; }
        .admin-active { background: #e74c3c !important; color: white !important; border-color: #c0392b !important; }
        .token-active { background: #eafaf1 !important; color: #27ae60 !important; border-color: #2ecc71 !important; }
        
        .machine-group-title { background-color: #ecf0f1; padding: 8px 12px; margin-top: 15px; margin-bottom: 0; border-left: 4px solid #3498db; color: #2c3e50; font-size: 15px; font-weight: bold; border-top-left-radius: 4px; border-top-right-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; transition: 0.2s; }
        .machine-group-title:hover { background-color: #dadddf; }
        .toggle-icon { font-size: 12px; color: #7f8c8d; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 5px; }
        .history-table th, .history-table td { padding: 4px 6px; border-bottom: 1px solid #ddd; text-align: center; }
        .history-table th { background-color: #34495e; color: white; font-weight: bold; padding: 6px 6px; }
        .history-table tbody tr:hover { background-color: #f1f2f6; }
        .row-expired { background-color: #ffcccc !important; color: #c0392b; font-weight: bold; }
        .row-warning { background-color: #fff3cd !important; color: #d35400; font-weight: bold; }
        .row-inactive { color: #95a5a6; }
        .action-btns { display: flex; gap: 4px; justify-content: center; }
        .edit-btn { background-color: #3498db; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 3px 6px; font-size: 12px; transition: 0.2s; }
        .edit-btn:hover { background-color: #2980b9; }
        .del-btn { background-color: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 3px 6px; font-size: 12px; transition: 0.2s; }
        .del-btn:hover { background-color: #c0392b; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 25px; border-radius: 8px; width: 90%; max-width: 350px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .modal-btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .modal-btn-cancel { background: #95a5a6; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .modal-btn-save { background: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* ========================================================
           🌟 核心修改：列印專用排版 (@media print)
           ======================================================== */
        @media print {
            @page { margin: 0; }
            body { background-image: none !important; background-color: white !important; padding: 0 !important; margin: 0 !important; font-family: '微軟正黑體', 'Microsoft JhengHei', sans-serif !important; }
            .main-wrapper, .container { display: block !important; padding: 0 !important; margin: 0 !important; border: none !important; box-shadow: none !important; position: static !important; width: auto !important; max-width: none !important; }
            h2, .form-group, #specialActionGroup, #pastThawGroup, .format-group, .print-btn, #historySection, .modal-overlay { display: none !important; }
            
            #previewContainer { margin: 0 !important; padding: 0 !important; border: none !important; }

            .result-card {
                display: flex; flex-direction: column; justify-content: flex-start !important; position: relative;
                background-color: white !important; border: none !important; 
                box-sizing: border-box !important; margin: 0 !important;
                padding-top: 1mm !important; padding-bottom: 0.5mm !important; 
                padding-right: 1mm !important; padding-left: 2.5mm !important;
            }

            .result-card p, .result-card span { 
                font-size: 6.5pt !important; 
                margin: 0.2mm 0 !important; 
                line-height: 1.15 !important; 
                color: black !important; 
                white-space: nowrap; 
                overflow: hidden; 
                font-weight: bold !important; 
            }
            .print-special-tag { 
                position: absolute; top: 1mm; right: 0.5mm; 
                font-size: 6.5pt !important; 
                color: black !important; 
                font-weight: bold !important; 
            }
            
            body.print-single @page { size: 23mm 15mm; margin: 0; }
            body.print-single { width: 23mm !important; height: 15mm !important; overflow: hidden !important; }
            body.print-single #previewContainer { display: block !important; width: 23mm !important; height: 15mm !important; overflow: hidden !important; }
            body.print-single #card1 { width: 23mm !important; height: 15mm !important; max-height: 15mm !important; page-break-after: avoid !important; page-break-inside: avoid !important; }
            body.print-single #card2 { display: none !important; }

            body.print-double @page { size: 46mm 15mm; margin: 0; }
            body.print-double { width: 46mm !important; height: 15mm !important; overflow: hidden !important; }
            body.print-double #previewContainer { 
                display: flex !important; flex-direction: row !important; width: 46mm !important; height: 15mm !important; 
                margin: 0 !important; padding: 0 !important; gap: 0 !important; page-break-after: avoid !important; page-break-inside: avoid !important; overflow: hidden !important;
            }
            body.print-double .result-card { 
                width: 23mm !important; height: 15mm !important; max-height: 15mm !important; border: none !important; 
            }
        }
    </style>
</head>
<body class="print-single"> 

<div class="main-wrapper">
    <div class="container">
        <h2>大實驗組試劑效期標籤小工具</h2>
        
        <div class="form-group">
            <label for="employeeId">員工編號：</label>
            <input type="text" id="employeeId" placeholder="請輸入5位數員工編號 (如: 1XXXX)" maxlength="5" inputmode="numeric">
        </div>

        <div class="form-group">
            <label for="machineSelect">選擇機台：</label>
            <select id="machineSelect">
                <option value="">-- 請選擇機台 --</option>
                <optgroup label="【-- 生化免疫組 --】">
                    <option value="1">700/5800共用項目</option>
                    <option value="2">5800免疫項目</option>
                    <option value="3">9000</option>
                    <option value="4">Cobos801i</option>
                    <option value="5">手工項目</option>
                    <option value="6">衛耗材</option>
                </optgroup>
                <optgroup label="【-- 血液鏡檢組 --】">
                    <option value="7">CS-2500</option>
                    <option value="8">G11</option>
                    <option value="9">HM-Jack</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label for="categorySelect">試劑類型：</label>
            <select id="categorySelect" disabled>
                <option value="">-- 請先選擇機台 --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="reagentSelect">品管液/校正液名稱：</label>
            <select id="reagentSelect" disabled>
                <option value="">-- 請先選擇試劑類型 --</option>
            </select>
        </div>

        <!-- 🌟 批號輸入區塊：支援高低濃度分開填寫 -->
        <div class="form-group" id="lotNumberGroup" style="display:none;">
            <!-- 一般項目 或 低濃度 (L) 批號 -->
            <div id="lotNumberLGroup">
                <label for="lotNumber">試劑批號 (Batch / Lot No.) <span style="color:red;">*</span>：</label>
                <input type="text" id="lotNumber" placeholder="請輸入批號 (必填)" maxlength="40">
            </div>
            
            <!-- 高濃度 (H) 專屬批號 (預設隱藏，只在雙張項目顯示) -->
            <div id="lotNumberHGroup" style="display:none; margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px;">
                <label for="lotNumberH">高濃度 (H) 試劑批號 <span style="color:red;">*</span>：</label>
                <input type="text" id="lotNumberH" placeholder="請輸入高濃度批號 (必填)" maxlength="40">
            </div>
        </div>

        <div id="specialActionGroup">
            <div class="special-action-title">💡 特殊作業 (勾選不覆蓋現役效期)</div>
            <div id="newLotCheckWrapper" style="display:none; margin-bottom: 6px;">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="chkNewLot" onchange="updatePreview()"> 標示為【新批號測試】
                </label>
            </div>
            <div id="thawCheckWrapper" style="display:none;">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="chkThaw" onchange="updatePreview()"> 執行【解凍作業】(不開瓶)
                </label>
            </div>
        </div>

        <div class="form-group" id="pastThawGroup">
            <label for="pastThawSelect">請選取對應的解凍紀錄：</label>
            <select id="pastThawSelect" onchange="updatePreview()"></select>
        </div>

        <div class="form-group" id="manualExpireGroup">
            <label for="manualExpireDate">到期日期 (請查看瓶身期限標示)：</label>
            <input type="date" id="manualExpireDate">
        </div>

        <div class="format-group" id="formatSelectGroup" style="display:none;">
            <div class="format-title">📐 選擇列印格式：</div>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="printFormat" value="single" checked onchange="toggleFormatMode()"> 
                    單張標籤 (23mm * 15mm)
                </label>
                <label class="radio-label">
                    <input type="radio" name="printFormat" value="double" onchange="toggleFormatMode()"> 
                    雙張並排 (46mm * 15mm 無縫拼接)
                </label>
            </div>
        </div>

        <div id="previewContainer">
            <!-- 卡片 1 (主卡片 / 低濃度L) -->
            <div class="result-card" id="card1">
                <span class="print-special-tag"></span>
                <p class="out-emp-id"></p>
                <p class="out-reagent"></p>
                <p class="out-lot-num" style="display:none;"></p> 
                <p class="thaw-row" style="display:none;">解: <span class="out-thaw-date highlight"></span></p>
                <p class="usable-row" style="display:none;">可: <span class="out-usable-date highlight"></span></p>
                <p class="open-row"><span class="out-date-label">開</span>: <span class="out-open-date highlight"></span></p>
                <p>到: <span class="out-expire-date highlight"></span></p>
            </div>
            <!-- 卡片 2 (複製卡片 / 高濃度H) -->
            <div class="result-card" id="card2" style="display:none;">
                <span class="print-special-tag"></span>
                <p class="out-emp-id"></p>
                <p class="out-reagent"></p>
                <p class="out-lot-num" style="display:none;"></p> 
                <p class="thaw-row" style="display:none;">解: <span class="out-thaw-date highlight"></span></p>
                <p class="usable-row" style="display:none;">可: <span class="out-usable-date highlight"></span></p>
                <p class="open-row"><span class="out-date-label">開</span>: <span class="out-open-date highlight"></span></p>
                <p>到: <span class="out-expire-date highlight"></span></p>
            </div>
        </div>
        
        <button class="print-btn" onclick="validateAndPrint()">🖨️ 列印標籤</button>
    </div>

    <!-- 右側：全品項記憶追蹤面板 -->
    <div id="historySection">
        <div class="history-header-wrapper">
            <div class="header-title-group">
                <h3>📋大實驗組試劑效期狀態</h3>
                <button class="admin-toggle-btn" id="adminToggleBtn" onclick="toggleAdmin()">🔒 管理員登入</button>
                <button class="admin-toggle-btn" id="tokenSettingBtn" onclick="openTokenModal()" title="設定雲端 API 科室通行碼">🔑 通行碼</button>
            </div>
            <div class="header-btn-group"></div>
        </div>
        <div id="historyContainer"></div>
    </div>
</div> 

<!-- 登入 Modal -->
<div class="modal-overlay" id="loginModal">
    <div class="modal-content">
        <h3>🔒 系統管理員驗證</h3>
        <p style="font-size: 13px; color: #7f8c8d; margin-bottom: 15px;">請輸入管理員密碼以啟用編輯與清除權限。</p>
        <div class="form-group" style="margin-bottom: 0;">
            <input type="password" id="adminPwd" placeholder="請輸入密碼" onkeypress="if(event.key === 'Enter') submitLogin()">
        </div>
        <div class="modal-btn-group">
            <button class="modal-btn-cancel" onclick="closeModals()">取消</button>
            <button class="modal-btn-save" onclick="submitLogin()">登入</button>
        </div>
    </div>
</div>

<!-- 科室通行碼設定 Modal -->
<div class="modal-overlay" id="tokenModal">
    <div class="modal-content">
        <h3>🔑 科室雲端通行碼設定</h3>
        <p style="font-size: 13px; color: #7f8c8d; margin-bottom: 15px;">設定後將儲存於本機瀏覽器，每次與雲端同步或出庫時會自動附帶此通行碼供後端驗證。</p>
        <div class="form-group" style="margin-bottom: 0;">
            <input type="password" id="labTokenInput" placeholder="請輸入科室通行碼 (未啟用可留空)" onkeypress="if(event.key === 'Enter') saveTokenSetting()">
        </div>
        <div class="modal-btn-group">
            <button class="modal-btn-cancel" onclick="closeModals()">取消</button>
            <button class="modal-btn-save" onclick="saveTokenSetting()">💾 儲存並重整</button>
        </div>
    </div>
</div>

<!-- 編輯 Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3>✏️ 編輯試劑效期</h3>
        <p id="editItemName" style="font-weight: bold; color: #2980b9; margin-bottom: 15px;"></p>
        
        <div class="form-group">
            <label>開/解日 (格式範例: 24/05/01)</label>
            <input type="text" id="editOpenDate" maxlength="10">
        </div>
        <div class="form-group">
            <label>到期日 (格式範例: 24/05/08)</label>
            <input type="text" id="editExpireDate" maxlength="10">
        </div>
        
        <div class="modal-btn-group">
            <button class="modal-btn-cancel" onclick="closeModals()">取消</button>
            <button class="modal-btn-save" id="editSaveBtn" onclick="saveEdit()">💾 儲存並同步雲端</button>
        </div>
    </div>
</div>

<script>
    let reagentData = []; 
    let clockDriftWarned = false;

    const machineNameToId = {
        "700/5800共用項目": 1,
        "5800免疫項目": 2,
        "9000": 3,
        "Cobos801i": 4,
        "手工項目": 5,
        "衛耗材": 6,
        "CS-2500": 7,
        "G11": 8,
        "HM-Jack": 9
    };

    const machineNameMap = {
        1: "700/5800共用項目",
        2: "5800免疫項目",
        3: "9000",
        4: "Cobos801i",
        5: "手工項目",
        6: "衛耗材",
        7: "CS-2500",
        8: "G11",
        9: "HM-Jack"
    };

    // ==========================================
    // 🛡️ 資安防護輔助函式 (XSS 過濾、SHA-256 雜湊、通行碼與時間檢查)
    // ==========================================
    const ADMIN_PASSWORD_HASH = "defdae444b7e18190479ab79b244be809e144bc9a8d6033426919efcf51ceb06"; // 預設密碼之 SHA-256 雜湊值
    const LAB_TOKEN_KEY = "reagentLabToken";
    let sessionAdminHash = "";

    // 1. HTML 特殊字元跳脫，防止 Stored / DOM XSS 攻擊
    function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str).replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[m];
        });
    }

    // 2. 過濾輸入框危險字元
    function sanitizeInputText(str) {
        if (!str) return "";
        return String(str).replace(/[<>"'&]/g, '');
    }

    // 3. 計算 SHA-256 雜湊值 (支援 HTTPS Web Crypto API 與本地備援)
    async function computeSha256(message) {
        if (window.crypto && window.crypto.subtle) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        } else {
            // 若於非 HTTPS (如本機 file://) 開啟導致無法呼叫 crypto.subtle 的純 JS SHA-256 備援實作
            function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
            var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length', i, j, result = '';
            var words = [], asciiBitLength = message[lengthProperty] * 8;
            var hash = [], k = [], primeCounter = 0;
            var isComposite = {};
            for (var candidate = 2; primeCounter < 64; candidate++) {
                if (!isComposite[candidate]) {
                    for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                    hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                    k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
                }
            }
            message += '\x80';
            while (message[lengthProperty] % 64 - 56) message += '\x00';
            for (i = 0; i < message[lengthProperty]; i++) {
                j = message.charCodeAt(i);
                if (j >> 8) return '';
                words[i >> 2] |= j << ((3 - i) % 4) * 8;
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength);
            for (j = 0; j < words[lengthProperty];) {
                var w = words.slice(j, j += 16), oldHash = hash;
                hash = hash.slice(0, 8);
                for (i = 0; i < 64; i++) {
                    var i2 = i + j, w15 = w[i - 15], w2 = w[i - 2];
                    var a = hash[0], e = hash[4];
                    var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
                    var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                    hash = [(temp1 + temp2) | 0].concat(hash);
                    hash[4] = (hash[4] + temp1) | 0;
                }
                for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
            }
            for (i = 0; i < 8; i++) {
                for (j = 3; j + 1; j--) {
                    var b = (hash[i] >> (j * 8)) & 255;
                    result += ((b < 16) ? 0 : '') + b.toString(16);
                }
            }
            return result;
        }
    }

    // 4. 取得本機設定之科室通行碼，並附加於 URL (避免觸發 CORS 預檢失敗)
    function getLabToken() {

    function appendTokenToUrl(baseUrl) {

    // 5. 檢查伺服器標準時間與本機時鐘是否偏移超過 15 分鐘
    function checkServerClockDrift(response) {
        if (clockDriftWarned || !response || !response.headers) return;
        const serverDateStr = response.headers.get('Date') || response.headers.get('date');
        if (serverDateStr) {
            const serverTime = new Date(serverDateStr).getTime();
            const localTime = Date.now();
            if (!isNaN(serverTime)) {
                const diffMinutes = Math.abs(localTime - serverTime) / (1000 * 60);
                if (diffMinutes > 15) {
                    clockDriftWarned = true;
                    alert(`⚠️ 系統時間異常警告：\n這台電腦的系統時間與雲端標準時間相差約 ${Math.round(diffMinutes)} 分鐘！\n為確保試劑到期日與出庫紀錄正確，請先校正電腦右下角的日期與時間。`);
                }
            }
        }
    }

    // 🌟 安全解析日期字串為時間戳記
    function parseExpireTimestamp(dateStr, fallbackValidDays) {
        if (dateStr && dateStr !== "-" && dateStr !== "無紀錄") {
            const cleanStr = dateStr.toString().trim().split('T')[0].split(' ')[0];
            const p = cleanStr.split(/[\/\-]/);
            if (p.length === 3) {
                let y = parseInt(p[0], 10);
                let m = parseInt(p[1], 10) - 1;
                let d = parseInt(p[2], 10);
                if (y < 100) y += 2000; 
                const dt = new Date(y, m, d, 23, 59, 59, 999);
                if (!isNaN(dt.getTime())) return dt.getTime();
            }
        }
        const fallback = new Date();
        if (typeof fallbackValidDays === 'number' && fallbackValidDays > 0) {
            fallback.setDate(fallback.getDate() + fallbackValidDays);
        }
        fallback.setHours(23, 59, 59, 999);
        return fallback.getTime();
    }

    // 🌟 1. 帶有強力除錯功能的出庫試劑讀取
    async function loadReagentsFromCloud() {
        const getUrl = appendTokenToUrl("https://defaulta2bef7fe039e4eeebc6a1e7e6ffaaf.b3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/09/workflows/2c55c100fe01408c8e0172524d56c7eb/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=D1YIFe76r_Fngcz7liZDVng5qkJsUReGa9WRTl8-PX0");
        try {
            const response = await fetch(getUrl, { method: 'GET' });
            checkServerClockDrift(response);
            
            // 如果伺服器回應 401, 403, 500 等錯誤，抓取具體原因
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP 狀態碼: ${response.status}。\n伺服器回應: ${errorText.substring(0, 100)}`);
            }
            
            const data = await response.json();
            
            // 防呆：如果 Power Automate 突然回傳非陣列的錯誤物件，攔截並顯示
            if (!Array.isArray(data)) {
                throw new Error(`API 回傳的格式異常，預期為陣列，實際收到: ${typeof data}\n可能 Power Automate 未正確讀取 SharePoint`);
            }
            
            reagentData = data.map(item => {
                const machineStr = item.Machine?.Value || item.Machine;
                const categoryStr = item.Category?.Value || item.Category;
                const typeStr = item.TypeTag?.Value || item.TypeTag;
                const reagentName = item.Title || "";
                
                // 🌟 針對特定 MAS 項目強制啟用解凍邏輯
                let forceHasThaw = item.HasThaw || false;
                if (reagentName.includes("MAS 1") || reagentName.includes("MAS 3")) {
                    forceHasThaw = true;
                }

                return {
                    name: reagentName,
                    validDays: item.ValidDays === -1 ? "manual" : item.ValidDays,
                    type: (typeStr && typeStr.trim() !== "") ? typeStr : "開",
                    category: categoryStr,
                    machine: machineNameToId[machineStr],
                    blankOpen: item.BlankOpen || false,
                    hasThaw: forceHasThaw
                };
            });
            console.log("✅ 雲端載入成功共 " + reagentData.length + " 筆");
            await syncDashboardFromCloud(); 
        } catch (error) {
            console.error("❌ 載入失敗:", error);
            alert("⚠️ 資料庫連線失敗！\n\n詳細原因：\n" + error.message + "\n\n(若是 401/403 錯誤，請檢查科室通行碼或 Power Automate 網址授權碼；若是 Failed to fetch，請檢查醫院防火牆或網路連線)");
        }
    }

    // 🌟 2. 更嚴謹的戰情面板同步 (防止 logsArray 解析失敗)
    async function syncDashboardFromCloud() {
        const getLogUrl = appendTokenToUrl("https://defaulta2bef7fe039e4eeebc6a1e7e6ffaaf.b3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/26/workflows/f26220adf84f4b48bb2f4c815ba94c25/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=LcDyVfadFRSR6o2WtzwsKrK_qTXv6oa-nxmWUAXM_Zg");
        
        try {
            const response = await fetch(getLogUrl, { method: 'GET' });
            checkServerClockDrift(response);
            if (!response.ok) throw new Error(`讀取歷史紀錄失敗 (HTTP ${response.status})`);
            const cloudLogs = await response.json();

            const dashboardData = {};
            
            // 安全解構資料陣列，防範 undefined 或物件導致 .reverse() 崩潰
            let logsArray = [];
            if (Array.isArray(cloudLogs)) {
                logsArray = cloudLogs;
            } else if (cloudLogs && Array.isArray(cloudLogs.value)) {
                logsArray = cloudLogs.value;
            } else {
                console.warn("⚠️ 歷史紀錄 API 回傳格式不如預期：", cloudLogs);
            }

            // 複製一份陣列再反轉，避免改動到原始參考
            const sortedLogs = [...logsArray].reverse();

            sortedLogs.forEach(item => {
                let rawName = item.name || item.Name || item.Title || item.ReagentName || item['項目名稱'] || item['試劑名稱'] || item.OData_name || "";
                if (!rawName) {
                    for (let key in item) {
                        if (typeof item[key] === 'string' && reagentData.some(r => item[key].includes(r.name))) {
                            rawName = item[key];
                            break;
                        }
                    }
                }
                if (!rawName) return;

                const cleanName = rawName.replace(/\[.*?\]\s*/g, '').trim();
                const matchedReagent = reagentData.find(r => r.name === cleanName);

                let machine = item.machine || item.Machine || item['機台'] || item['機台分類'] || item.OData_machine || "";
                if (machine && typeof machine === 'object' && machine.Value) machine = machine.Value;
                if (!machine && matchedReagent) {
                    machine = machineNameMap[matchedReagent.machine];
                }
                if (!machine) return;

                const uniqueKey = machine + "_" + cleanName;

                if (rawName.includes("[清除]")) {
                    delete dashboardData[uniqueKey];
                    return;
                }

                let openDate = item.openDate || item.OpenDate || item['開解日'] || item['開/解日'] || item.OData_openDate || "";
                let expireDate = item.expireDate || item.ExpireDate || item['到期日'] || item.OData_expireDate || "";

                if (!openDate || !expireDate) {
                    const dateCandidates = [];
                    for (let key in item) {
                        if (['Created', 'Modified', 'printTime', 'PrintTime'].includes(key)) continue;
                        let val = item[key];
                        if (typeof val === 'string' && /^\d{2,4}[\/\-]\d{2}[\/\-]\d{2}$/.test(val.trim())) {
                            dateCandidates.push(val.trim());
                        }
                    }
                    if (!openDate && dateCandidates.length >= 1) openDate = dateCandidates[0];
                    if (!expireDate && dateCandidates.length >= 2) expireDate = dateCandidates[1];
                }

                let empId = item.empId || item.EmpId || item.employeeId || item.EmployeeId || item.EmployeeID || item.Operator || item.operator || item['操作人'] || item['員工編號'] || item.OData_empId || "";
                if (!empId) {
                    for (let key in item) {
                        let val = item[key];
                        if (val !== null && val !== undefined) {
                            let strVal = val.toString().trim();
                            if (/^\d{5}$/.test(strVal) && key !== 'Title' && key !== 'name' && key !== 'Name' && key !== 'ID') {
                                empId = strVal;
                                break;
                            }
                        }
                    }
                }
                
                let lotNumber = item.lotNumber || item.LotNumber || item.lot || item.Lot || item['批號'] || item.OData_lotNumber || "";

                if (!rawName.includes("[新批") && !rawName.includes("[解凍]")) {
                    const expTimestamp = parseExpireTimestamp(expireDate, matchedReagent ? matchedReagent.validDays : 0);
                    dashboardData[uniqueKey] = {
                        machine: sanitizeInputText(machine),
                        name: sanitizeInputText(cleanName),
                        lotNumber: sanitizeInputText(lotNumber),
                        openDate: sanitizeInputText(openDate),
                        expireDate: sanitizeInputText(expireDate),
                        expireTimestamp: expTimestamp,
                        empId: sanitizeInputText(empId)
                    };
                }
            });

            saveDashboardData(dashboardData);
            console.log("✅ 成功與 Reagent_Usagelog 資料庫連動同步！");

        } catch (error) {
            console.error("❌ 同步歷史面板失敗:", error);
        } finally {
            renderHistory();
        }
    }

    async function saveEdit() {
        if (!isAdmin || !sessionAdminHash) {
            alert("⚠️ 管理員權限未驗證！");
            closeModals();
            return;
        }
        const openDateStr = sanitizeInputText(document.getElementById('editOpenDate').value.trim());
        const expireDateStr = sanitizeInputText(document.getElementById('editExpireDate').value.trim());
        
        const datePattern = /^\d{2,4}[\/\-]\d{2}[\/\-]\d{2}$/;
        if (!datePattern.test(openDateStr) || !datePattern.test(expireDateStr)) {
            alert("⚠️ 日期格式不正確！請使用 YY/MM/DD 格式 (例如: 26/11/10)。");
            return;
        }

        const data = loadDashboardData();
        const record = data[currentEditKey];
        if (!record) { closeModals(); return; }

        const saveBtn = document.getElementById('editSaveBtn');
        const origBtnText = saveBtn.textContent;
        saveBtn.disabled = true;
        saveBtn.textContent = "⏳ 同步雲端中...";

        record.openDate = openDateStr;
        record.expireDate = expireDateStr;
        record.expireTimestamp = parseExpireTimestamp(expireDateStr, 0);
        
        const printTimestamp = new Date();
        const matchedReagent = reagentData.find(r => r.name === record.name);
        const logData = {
            printTime: printTimestamp.toLocaleString('zh-TW', { hour12: false }), 
            machine: record.machine,
            category: matchedReagent ? matchedReagent.category : "",
            name: "[修改] " + record.name, 
            openDate: openDateStr,
            expireDate: expireDateStr,
            empId: "管理員修改",
            lotNumber: record.lotNumber || "",
            labToken: getLabToken(),
            adminHash: sessionAdminHash
        };

        const postUrl = appendTokenToUrl("https://defaulta2bef7fe039e4eeebc6a1e7e6ffaaf.b3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/06/workflows/280bf053930a4bcba21e0f9c04725d97/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=b9ObHcylaV1UUUZkFW1CuW9zWEGTQpi35-I45n7B6Dk");

        try {
            const res = await fetch(postUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(logData)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            console.log("✅ 管理員修改已同步至 SharePoint");
        } catch (e) {
            console.error("❌ 雲端修改同步失敗:", e);
            alert("⚠️ 網路連線異常，修改僅暫存於本機，未同步至雲端後台。");
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = origBtnText;
        }

        saveDashboardData(data);
        appendUsageLog(logData);
        closeModals();
        renderHistory();
    }

        };

    function renderHistory() {
        const dashboardData = loadDashboardData();
        const historyContainer = document.getElementById('historyContainer');
        historyContainer.innerHTML = ''; 
        const now = new Date(); now.setHours(0, 0, 0, 0); 

        const maxMachineId = Math.max(...Object.keys(machineNameMap).map(Number));
        for (let mId = 1; mId <= maxMachineId; mId++) {
            const mName = machineNameMap[mId];
            const mReagents = reagentData.filter(r => r.machine === mId);
            if (mReagents.length === 0) continue; 

            if (collapseState[mId] === undefined) collapseState[mId] = true;

            let cExpired = 0, cWarning = 0, cNormal = 0, cInactive = 0;
            const rowsHtml = []; 

            mReagents.forEach(reagent => {
                const uniqueKey = mName + "_" + reagent.name;
                const record = dashboardData[uniqueKey];
                
                if (record) {
                    let rowClass = "", statusText = "✅ 架上使用中";
                    const expDate = new Date(record.expireTimestamp);
                    expDate.setHours(0, 0, 0, 0);
                    const diffDays = Math.floor((expDate.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));

                    if (diffDays < 0) { rowClass = "row-expired"; statusText = "❌ 已過期"; cExpired++; } 
                    else if (diffDays <= 1) { rowClass = "row-warning"; statusText = "⚠️ 明日到期"; cWarning++; } 
                    else cNormal++;

                    const safeUniqueKey = escapeHtml(uniqueKey);
                    let actionHtml = '-';
                    if (isAdmin && sessionAdminHash) {
                        // 🛡️ 使用 data-key 與 escapeHtml 防止屬性逃逸與 XSS
                        actionHtml = `<div class="action-btns"><button class="edit-btn" data-key="${safeUniqueKey}" onclick="openEditModal(this.getAttribute('data-key'))">✏️</button><button class="del-btn" data-key="${safeUniqueKey}" onclick="deleteRecord(event, this.getAttribute('data-key'))">🗑️</button></div>`;
                    }
                    
                    let nameDisplay = `<strong>${escapeHtml(record.name)}</strong>`;
                    if (record.lotNumber) {
                        nameDisplay += `<div style="font-size: 11px; color: #7f8c8d; margin-top: 2px;">Lot: ${escapeHtml(record.lotNumber)}</div>`;
                    }

                    rowsHtml.push(`<tr class="${rowClass}"><td>${nameDisplay}</td><td>${escapeHtml(record.openDate)}</td><td>${escapeHtml(record.expireDate)}</td><td>${statusText}</td><td>${escapeHtml(record.empId || '-')}</td><td>${actionHtml}</td></tr>`);
                } else {
                    cInactive++;
                    rowsHtml.push(`<tr class="row-inactive"><td>${escapeHtml(reagent.name)}</td><td>-</td><td>-</td><td>⚪ 尚未開</td><td>-</td><td>-</td></tr>`);
                }
            });

            const isCollapsed = collapseState[mId];
            const mHeader = document.createElement('h4');
            mHeader.className = 'machine-group-title';
            mHeader.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span>${escapeHtml(mName)}</span>
                    <div class="summary-badges" style="display: flex; gap: 5px; font-size: 12px; font-weight: normal;">
                        ${cExpired > 0 ? `<span style="background: #ffcccc; color: #c0392b; padding: 2px 8px; border-radius: 12px;">❌ ${cExpired}</span>` : ''}
                        ${cWarning > 0 ? `<span style="background: #fff3cd; color: #d35400; padding: 2px 8px; border-radius: 12px;">⚠️ ${cWarning}</span>` : ''}
                        ${cNormal > 0 ? `<span style="background: #eafaf1; color: #27ae60; padding: 2px 8px; border-radius: 12px;">✅ ${cNormal}</span>` : ''}
                        ${cInactive > 0 ? `<span style="background: #eaeded; color: #7f8c8d; padding: 2px 8px; border-radius: 12px;">⚪ ${cInactive}</span>` : ''}
                    </div>
                </div>
                <span class="toggle-icon">${isCollapsed ? '▶' : '▼'}</span>
            `;
            historyContainer.appendChild(mHeader);

            const tableWrap = document.createElement('div');
            tableWrap.style.overflowX = 'auto';
            if (isCollapsed) tableWrap.style.display = 'none';
            tableWrap.innerHTML = `<table class="history-table"><thead><tr><th style="width:26%;">項目名稱</th><th>開/解日</th><th>到期日</th><th>狀態</th><th>操作人</th><th>操作</th></tr></thead><tbody>${rowsHtml.join('')}</tbody></table>`;
            historyContainer.appendChild(tableWrap);

            mHeader.addEventListener('click', function() {
                collapseState[mId] = !collapseState[mId]; 
                if (collapseState[mId]) {
                    tableWrap.style.display = 'none'; this.querySelector('.toggle-icon').textContent = '▶';
                } else {
                    tableWrap.style.display = 'block'; this.querySelector('.toggle-icon').textContent = '▼';
                }
            });
        }
    }

                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(logData)
                    });
                } catch (e) {
                    console.error("雲端清除訊號發送失敗", e);
                }
            }

            delete dashboardData[key]; 
            saveDashboardData(dashboardData); 
            renderHistory();
        }
    };

    async function validateAndPrint() {
        const empIdValue = empIdInput.value.trim();
        if (empIdValue === "" || !/^\d{5}$/.test(empIdValue)) return alert("⚠️ 請輸入正確的 5 位數字員工編號！"), empIdInput.focus();

        const selectedIndex = selectElement.value;
        if (selectedIndex !== "") {
            const selectedReagent = reagentData[selectedIndex];
            
            // 🌟 針對 CS-2500 (代碼7) 的批號必填驗證邏輯
            const currentMachine = machineSelect.value;
            if (currentMachine === "7") { 
                const lotVal = document.getElementById('lotNumber').value.trim();
                if (lotVal === "") {
                    alert("⚠️ CS-2500 機台請務必填寫【試劑批號】！");
                    document.getElementById('lotNumber').focus();
                    return; 
                }

                // 檢查是否為 L/H 雙張項目，同時檢查第二個高濃度批號框
                const specialLHItems = ["D-DIMER QC", "HbA1c QC", "FOBT Cali", "FOBT QC"];
                const isLHItem = specialLHItems.some(item => selectedReagent.name.includes(item));
                
                if (isLHItem) {
                    const lotValH = document.getElementById('lotNumberH').value.trim();
                    if (lotValH === "") {
                        alert("⚠️ 雙張項目的【高濃度 (H) 試劑批號】也必須填寫！");
                        document.getElementById('lotNumberH').focus();
                        return;
                    }
                }
            }
            
            if (selectedReagent.validDays === "manual") {
                const inputDateVal = manualExpireDate.value;
                if (!inputDateVal) return alert("⚠️ 請輸入到期日期！"), manualExpireDate.focus();
                const selectedDate = new Date(inputDateVal);
                const today = new Date(); today.setHours(0, 0, 0, 0); 
                if (selectedDate < today) return alert("⚠️ 到期日期不可為過去日期！"), manualExpireDate.focus();
            }
        }
        await recordCurrentPrint();
        window.print();
    }

    window.addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = ''; });
</script>
